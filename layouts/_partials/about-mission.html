<div class="relative max-w-5xl mx-auto text-start bg-sage p-8 md:p-12 rounded-2xl gap-6 lg:mt-30 mt-12 lg:mb-12 md:min-h-96 overflow-hidden">
  {{ $dataFile := printf "about-mission.%s" .Lang }}
  {{ $data := index hugo.Data $dataFile }}
  <div class="absolute inset-0 bg-contain bg-no-repeat bg-right-top opacity-10 lg:opacity-100 z-10" style="background-image: url('{{ partial "img-src.html" (dict "src" ($data.image | default "/media/images/mission-flower.png") "width" 900) }}');"></div>
  <div class="relative max-w-lg z-20">
    <h3 class="text-5xl">{{ $data.title }}</h3>
    <p class="mt-4 text-gray-800">{{ $data.text }}</p>
  </div>
</div>
