<button 
  x-data="{ show: false }"
  x-init="window.addEventListener('scroll', () => { show = window.scrollY > 500 })"
  x-show="show"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-4"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-4"
  @click="window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); document.getElementById('content').focus({ preventScroll: true })"
  class="fixed bottom-8 right-8 z-50 rounded-full bg-ink p-3 text-white shadow-lg transition hover:bg-cocoa focus:outline-none focus:ring-2 focus:ring-ink focus:ring-offset-2"
  aria-label="{{ i18n "strings.scroll_to_top" }}"
  x-cloak
>
  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
  </svg>
</button>
