{{- $contactEmail := (index .Site.Params.contact.emails 0).address | default "hello@interalia.host" -}}
<section class="relative bg-[#F5D9CC] py-12 px-8 md:px-12 lg:py-16">
    <!-- Background Pattern -->
    <div class="pointer-events-none absolute inset-0 bg-contain bg-right bg-no-repeat opacity-0 md:opacity-80" style="background-image: url('/media/images/pattern-2.svg');"></div>
  
    <div class="relative mx-auto max-w-6xl grid grid-cols-1 items-center gap-12 lg:grid-cols-2">
      <!-- Contact Form Section -->
      <div>
        <p class="text-lg text-gray-700">{{ i18n "strings.project_help" }}</p>
        <h2 class="mt-2 text-3xl leading-tight text-gray-900 md:text-5xl">
          {{ i18n "strings.get_in_touch" }}
        </h2>
  
        <form id="contact-form" class="mt-8 space-y-6" novalidate>
          <!-- Company / Organization -->
          <div class="space-y-1">
            <label for="contact-company" class="block text-sm font-medium text-gray-900">{{ i18n "strings.company_org" }}</label>
            <input type="text" id="contact-company" name="company"
                   class="w-full border-b border-gray-900 bg-transparent py-2 text-gray-900 placeholder-gray-500 focus:border-[#2C1B1B] focus:outline-none focus:ring-0"
                   required aria-required="true" autocomplete="organization">
          </div>
  
          <!-- Name -->
          <div class="space-y-1">
            <label for="contact-name" class="block text-sm font-medium text-gray-900">{{ i18n "strings.name" }}</label>
            <input type="text" id="contact-name" name="name" 
                   class="w-full border-b border-gray-900 bg-transparent py-2 text-gray-900 placeholder-gray-500 focus:border-[#2C1B1B] focus:outline-none focus:ring-0"
                   required aria-required="true" autocomplete="name">
          </div>
  
          <!-- Email -->
          <div class="space-y-1">
            <label for="contact-email" class="block text-sm font-medium text-gray-900">{{ i18n "strings.email" }}</label>
            <input type="email" id="contact-email" name="email"
                   class="w-full border-b border-gray-900 bg-transparent py-2 text-gray-900 placeholder-gray-500 focus:border-[#2C1B1B] focus:outline-none focus:ring-0"
                   required aria-required="true" autocomplete="email">
          </div>
  
          <!-- Message -->
          <div class="space-y-1">
            <label for="contact-message" class="block text-sm font-medium text-gray-900">{{ i18n "strings.message" }}</label>
            <textarea id="contact-message" name="message" rows="4"
                      class="w-full resize-none border-b border-gray-900 bg-transparent py-2 text-gray-900 placeholder-gray-500 focus:border-[#2C1B1B] focus:outline-none focus:ring-0"
                      required aria-required="true"></textarea>
          </div>
  
          <!-- Location Selection -->
          <fieldset class="mt-4">
            <legend class="font-medium text-gray-900">{{ i18n "strings.location" }}</legend>
            <div class="mt-3 flex flex-wrap gap-4">
              <label class="flex cursor-pointer items-center gap-2">
                <input type="radio" name="location" value="Germany" class="h-4 w-4 border-gray-900 text-[#2C1B1B] focus:ring-2 focus:ring-[#2C1B1B] focus:ring-offset-2" required aria-required="true">
                <span>{{ i18n "strings.germany" }}</span>
              </label>
              <label class="flex cursor-pointer items-center gap-2">
                <input type="radio" name="location" value="Europe" class="h-4 w-4 border-gray-900 text-[#2C1B1B] focus:ring-2 focus:ring-[#2C1B1B] focus:ring-offset-2">
                <span>{{ i18n "strings.europe" }}</span>
              </label>
              <label class="flex cursor-pointer items-center gap-2">
                <input type="radio" name="location" value="Other" class="h-4 w-4 border-gray-900 text-[#2C1B1B] focus:ring-2 focus:ring-[#2C1B1B] focus:ring-offset-2">
                <span>{{ i18n "strings.other" }}</span>
              </label>
            </div>
          </fieldset>
  
          <!-- Submit Button -->
          <button type="submit"
                  class="mt-4 rounded-full bg-[#2C1B1B] px-6 py-3 text-lg text-white transition hover:bg-[#6E4242] focus:outline-none focus:ring-2 focus:ring-[#2C1B1B] focus:ring-offset-2">
            {{ i18n "strings.submit" }}
          </button>
          <span id="contact-feedback" class="sr-only" aria-live="polite"></span>
        </form>
        <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
          e.preventDefault();
          const company = document.getElementById('contact-company').value;
          const name = document.getElementById('contact-name').value;
          const email = document.getElementById('contact-email').value;
          const message = document.getElementById('contact-message').value;
          const location = document.querySelector('input[name="location"]:checked')?.value || '';
          const subject = 'Inquiry';
          const body =
            `Company / Organization: ${company}\n` +
            `Name: ${name}\n` +
            `Email: ${email}\n` +
            `Location: ${location}\n` +
            `Message: ${message}`;
          const mailto = `mailto:{{ $contactEmail }}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
          window.location.href = mailto;
        });
        </script>
      </div>
    </div>
</section>
