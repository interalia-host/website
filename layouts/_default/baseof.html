<!DOCTYPE html>
<html lang="{{ .Site.Language }}" dir="{{ .Site.Language.Params.direction }}" itemscope itemtype="http://schema.org/WebPage">

<head>
    {{ partial "head.html" . }}
    {{/* View Transitions API */}}
    <style>
      @view-transition { navigation: auto; }
      body > header { view-transition-name: site-header; }
      body > footer { view-transition-name: site-footer; }
      body > main { view-transition-name: main-content; }
      ::view-transition-old(main-content),
      ::view-transition-new(main-content) {
        animation-duration: 0.25s;
        animation-timing-function: ease-in-out;
      }
    </style>
</head>

<body class="bg-[#FCFCF0]">
    <a class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-[#2C1B1B] focus:text-white focus:px-4 focus:py-2 focus:rounded-full" href="#content">{{ i18n "skip_to_content" }}</a>

    <header>
        {{ partial "nav.html" . }}
    </header>

    <main id="content" class="content">
        {{ block "main" . }}{{ end }}
    </main>

    {{ block "footer" . }}
    {{ partial "footer.html" . }}
    {{ end }}

    {{ partial "scroll-to-top.html" . }}

    {{ partial "javascript.html" . }}

</body>
</html>
