name: Deploy website

# Production is published from the root of the gh-pages branch
# (Settings → Pages → Source: "Deploy from a branch", gh-pages / root).
# PR previews live next to it in gh-pages/pr-preview/ (see preview.yml)
# and are left untouched by production deploys.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One production deploy at a time; pushes to gh-pages retry on conflicts
# with preview deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Hugo
        uses: actions/cache@v6
        with:
          path: |
            /tmp/hugo_cache
            resources/_gen
          key: ${{ runner.os }}-hugo-${{ hashFiles('layouts/**', 'content/**', 'static/media/**', 'hugo.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Build site
        run: npm run build
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_ENVIRONMENT: production

      - name: Add Pages files
        run: |
          echo 'interalia.host' > public/CNAME
          touch public/.nojekyll

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: public
          clean: true
          clean-exclude: pr-preview/
          force: false
          attempt-limit: 5
          commit-message: "Deploy ${{ github.sha }}"
