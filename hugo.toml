title = "interalia"
baseURL = "https://interalia.host"

defaultContentLanguage = "en"
languageCode = "en-us"
defaultContentLanguageInSubdir = true

rssLimit = 50

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = true
disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = true

pluralizeListTitles = false

timeout = "60s"
summaryLength = 70

[permalinks]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
    [markup.tableOfContents]
      startLevel = 2
      endLevel = 4

[taxonomies]
  category = "categories"
  tag = "tags"


[languages]
  [languages.en]
    languageName = "English"
    weight = 1
  [languages.en.params]
    languageName = "English"
    direction = "ltr"

  [languages.de]
    languageName = "Deutsch"
    weight = 2
  [languages.de.params]
    languageName = "Deutsch"
    direction = "ltr"

[privacy]
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
