title = "interalia"
baseURL = "https://interalia.host"

defaultContentLanguage = "en"
locale = "en-US"
defaultContentLanguageInSubdir = true

rssLimit = 50

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = true
disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = true

pluralizeListTitles = false

timeout = "60s"
summaryLength = 70

[permalinks]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
    [markup.tableOfContents]
      startLevel = 2
      endLevel = 4

# Articles live in content/reports/ but have no overview page of their own:
# they are listed on the Resources page, so don't render an empty /reports/ page.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "always"
  [cascade.target]
    path = "/reports"
    kind = "section"

# Expose uploaded media to Hugo Pipes so images can be resized and converted
# to WebP at build time (see layouts/partials/img.html). The originals are
# still published unchanged via the static mount.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/media"
    target = "assets/media"
  [[module.mounts]]
    source = "static"
    target = "static"

[imaging]
  resampleFilter = "Lanczos"
  [imaging.webp]
    quality = 82
    hint = "picture"

[taxonomies]
  category = "categories"
  tag = "tags"


[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
  [languages.en.params]
    direction = "ltr"

  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 2
  [languages.de.params]
    direction = "ltr"

[privacy]
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
