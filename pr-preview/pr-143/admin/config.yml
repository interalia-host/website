    label: 1 · Hero (top banner) — English
    file: data/hero.en.yml
    preview_path: en/
    format: yml
    fields:
    - {name: title, label: Headline, widget: string, hint: 'To make a word italic and thin, wrap it like this: <span class=''italic font-thin''>word</span>'}
    - {name: subtitle, label: Text below the headline, widget: text}
    - {name: primary_button, label: Contact button label, widget: string, hint: Opens an email to the contact address from Site settings.}
    - {name: secondary_button, label: About button label, widget: string, hint: Links to the About page.}
