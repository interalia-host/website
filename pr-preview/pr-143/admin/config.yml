# ────────────────────────── Settings ──────────────────────────

- name: settings
  label: Site settings
  preview_path: 'en/'
  description: Contact details, social links and sharing defaults.
  editor: {preview: false}
  files:
  - name: site
    label: Site settings
    file: config/_default/params.yml
    format: yml
    fields:
    - {label: Site description, name: description, widget: string, hint: 'Used in search results and when sharing, if a page has no summary of its own.'}
    - {label: Keywords, name: keywords, widget: string, required: false, hint: Comma-separated list of keywords.}
    - label: Homepage sharing image
      name: images
      widget: list
      required: false
      max: 1
      hint: 'Optional. Every page already gets an automatic sharing card with its title, and articles use their cover image. Upload an image here only to replace the homepage card; it is cropped to 1200×630.'
      field: {label: Image, name: image, widget: image, choose_url: false, media_library: {config: {max_file_size: 10485760}}}
    - label: Social media links
      name: social
      widget: list
      hint: Shown in the footer.
      summary: '{{fields.name}}'
      fields:
      - {label: Name, name: name, widget: string, hint: e.g. linkedin}
      - {label: URL, name: url, widget: string, pattern: ['^https?://\S+$', 'Enter a full link starting with https://.']}
    - label: Contact information
      name: contact
      widget: object
      fields:
      - {label: Organisation name, name: name, widget: string}
      - {label: Street address, name: address, widget: string}
      - {label: 'Postcode, city, country', name: city_state_zip, widget: string}
      - label: Emails
        name: emails
        widget: list
        hint: The first address is used for all contact buttons and the contact form.
        summary: '{{fields.address}}'
        fields:
        - {label: Email address, name: address, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address, e.g. hello@interalia.host.']}
        - {label: Label, name: label, widget: string}
      - label: Phone
        name: phone
        widget: object
        fields:
        - {label: Phone number, name: number, widget: string, pattern: ['^\+?[0-9 ()/-]{6,}$', 'Use digits, spaces and an optional leading +, e.g. +49 155 63208494.']}
        - {label: Label, name: label, widget: string}

- name: i18n
  label: Interface text
  preview_path: 'en/'
  description: 'Small texts used across the site: menu, buttons, form labels, accessibility labels. Only change the translation, never the key.'
  editor: {preview: false}
  files:
  - name: en
    label: English
    file: i18n/en.yaml
    format: yaml
    fields:
    - label: Texts
      name: strings
      widget: list
      allow_add: false
      collapsed: true
      summary: '{{fields.translation}}  ·  {{fields.id}}'
      fields:
      - {label: Key (do not change), name: id, widget: string, hint: Used by the website templates to find this text.}
      - {label: Text, name: translation, widget: text}
  - name: de
    label: Deutsch
    file: i18n/de.yaml
    format: yaml
    fields:
    - label: Texts
      name: strings
      widget: list
      allow_add: false
      collapsed: true
      summary: '{{fields.translation}}  ·  {{fields.id}}'
      fields:
      - {label: Key (do not change), name: id, widget: string, hint: Used by the website templates to find this text.}
      - {label: Text, name: translation, widget: text}
