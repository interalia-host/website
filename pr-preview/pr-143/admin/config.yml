# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
#
# Sidebar order = order of the collections below. Group headings and icons
# are added in static/admin/index.html (keyed by each collection's `name`),
# so keep the two in sync when adding a collection.

locale: "en"
logo:
  src: cms-logo.svg

site_url: https://interalia.host
display_url: https://interalia.host
# "View preview" on drafts uses the deploy/preview commit status that
# .github/workflows/preview.yml sets on each PR; "View live" uses site_url.
# Both append the preview_path of the entry.
show_preview_links: true

backend:
  name: github
  repo: interalia-host/website
  branch: main
  site_domain: interalia.host
  use_graphql: true
  squash_merges: true
  preview_context: deploy/preview
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Run `npm run cms` locally to edit files on disk without logging in.
local_backend: true

publish_mode: editorial_workflow
media_folder: static/media/uploads
public_folder: /media/uploads
# Image and file fields limit uploads to 10 MB (media_library.config.max_file_size).
# Images are optimised at build time, so originals only need to be good quality, not small.

# English and German are edited side by side.
# Files are stored as <name>.en.<ext> and <name>.de.<ext>.
i18n:
  structure: multiple_files
  locales: ["en", "de"]
  default_locale: "en"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

