# ───────────────────── Articles & reports ─────────────────────

- name: blog-posts
  label: Articles
  preview_path: 'en/reports/{{slug}}/'
  label_singular: Article
  description: Articles listed on the Resources page.
  folder: content/reports
  create: true
  delete: true
  i18n: true
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  summary: '{{title}} ({{year}})'
  sortable_fields:
  - date
  - title
  fields:
  - {name: title, label: Title, widget: string, i18n: true}
  - {name: date, label: Publication date, widget: datetime, i18n: duplicate, hint: Only the year is shown on the site; the full date is used to sort articles (newest first).}
  - {name: author, label: Author, widget: string, i18n: true, required: false}
  - {name: image, label: Cover image, widget: image, i18n: duplicate, required: false, choose_url: false, media_library: {config: {max_file_size: 10485760}}, hint: 'Shown on the article page, in the Resources list and when the article is shared. Landscape, at least 1600×900 px (16:9); keep important content in the centre. Resized and converted automatically. Max 10 MB.'}
  - {name: description, label: Short summary (SEO and sharing), widget: text, i18n: true, required: false, pattern: ['^[\s\S]{0,160}$', 'Keep it to 160 characters or fewer: search engines and social media cut off longer summaries.'], hint: 'Up to 160 characters.'}
  - {name: body, label: Text, widget: markdown, i18n: true}

- name: reports
  label: Reports
  preview_path: 'en/resources/'
  label_singular: Report
  description: Downloadable reports (PDF) listed on the Resources page.
  folder: data/reports
  create: true
  delete: true
  i18n: true
  extension: yml
  format: yml
  slug: '{{slug}}'
  summary: '{{title}} ({{year}})'
  fields:
  - {name: title, label: Title, widget: string, i18n: true}
  - {name: year, label: Year, widget: number, value_type: int, min: 2000, max: 2100, i18n: duplicate}
  - {name: image, label: Cover image, widget: image, i18n: duplicate, required: false, choose_url: false, media_library: {config: {max_file_size: 10485760}}, hint: 'Shown on the report card on the Resources page (cropped to a wide strip). Landscape, about 1200×800 px. Max 10 MB.'}
  - {name: download, label: PDF file, widget: file, i18n: duplicate, required: false, choose_url: false, media_library: {config: {max_file_size: 10485760}}, hint: 'PDF, max 10 MB. Use a short file name without spaces, e.g. annual-report-2026.pdf.'}

