bio: Marie hat langjährige Erfahrung im Stiftungs- und Nonprofit-Sektor. Bevor
  sie zu interalia kam, war Marie als Geschäftsführerin der Maecenata Stiftung
  in Berlin tätig. Ihr fachlicher Blick ist geprägt durch ihre Arbeit in der
  Programmleitung, Finanzsteuerung und Grant Management. Besonders wichtig ist
  ihr, organisatorische Strukturen so zu gestalten, dass gesellschaftliches
  Engagement wirksam und nachhaltig umgesetzt werden kann.
